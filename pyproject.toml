[project]
name = "framagen"
version = "0.1.0"
description = "LLM agent that generates ACSL specifications for C programs and checks them with Frama-C/WP"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "deepagents>=0.7.32",
    "jinja2>=3.1.6",
    "langchain-ollama>=1.0.1",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0.0"]
openai = ["langchain-openai>=1.0.0"]

[project.scripts]
framagen = "framagen.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/framagen"]

[dependency-groups]
dev = ["pytest>=8.0"]
